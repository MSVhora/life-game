# Copy to player.local.yml (gitignored) and edit. Values below are fake examples.
timezone: Asia/Kolkata
day:
  ends_at: "23:00"          # local time each day (24h cycle) ends
  tasks_required: 2         # tasks per day at the start; grows with the ramp
  grace_days_per_week: 1    # one missed day per week does not break the streak
gaming:
  daily_cap_minutes: 120
  minutes_per_task: 60      # per-task reward is min(this, daily_cap / tasks)
  loss_penalty: halve_next_day   # none | halve_next_day | zero_next_day
wake:
  goal_before: "12:00"      # wake-up goal today
  final_goal: "09:00"       # where the goal slowly moves to
  ramp_minutes_per_week: 15 # 0 = never move; irregular sleepers should go slowly
  source: manual            # manual (tap "I'm up") | phone (first phone use after a 3+ hour quiet gap)
sleep:
  goal_by: "03:00"
pressure:
  level: gradual            # data_only | gentle | gradual | harsh
ramp:
  max_tasks_per_day: 5
  raise_after_days_met: 5   # of the last 7 days, before adding one task per day
