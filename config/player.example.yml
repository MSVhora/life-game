# Copy to player.local.yml (gitignored) and edit. Values below are fake examples.
timezone: Asia/Kolkata
day:
  ends_at: "23:00"          # local time each day ends
  tasks_required: 2
  grace_days_per_week: 1
gaming:
  daily_cap_minutes: 150
  minutes_per_task: 60
  loss_penalty: halve_next_day   # none | halve_next_day | zero_next_day
wake:
  goal_before: "12:00"
  tighten_minutes_every_two_weeks: 30
pressure:
  level: mild               # mild | medium | strong | ramp
  scoreboard_public_link: false
  auto_post_anywhere: false # always false; the app never posts for you
